replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env: []

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

livenessProbe:
  enabled: true
  path: /manage/health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /manage/health
  initialDelaySeconds: 5
  periodSeconds: 5

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /
  pathType: Prefix