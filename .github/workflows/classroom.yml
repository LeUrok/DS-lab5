name: GitHub Classroom Workflow
on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/leurok/ds-lab5

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: |
          for svc in payment-service cars-service rental-service gateway-service; do
            echo "=== $svc ==="
            (cd $svc && go test ./... || true)
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 10
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in payment-service cars-service rental-service gateway-service; do
            docker buildx build --platform linux/amd64 \
              -t ${{ env.IMAGE_PREFIX }}/$svc:$TAG \
              --push ./$svc
          done

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Install cloudlogin
        run: |
          curl -LO https://github.com/cloud-ru-tech/cloudlogin/releases/latest/download/cloudlogin_Linux_amd64.tar.gz
          tar -xzf cloudlogin_Linux_amd64.tar.gz
          sudo mv cloudlogin /usr/local/bin/
          cloudlogin help

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Auth Secret
        run: |
          kubectl create secret generic auth-secret \
            --from-literal=client-secret='${{ secrets.AUTH0_CLIENT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres ./charts/postgres \
            --namespace default \
            --wait --timeout 10m

      - name: Deploy services
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in payment-service cars-service rental-service gateway-service; do
            helm upgrade --install $svc ./charts/app \
              -f ./charts/app/values-${svc%-service}.yaml \
              --set image.tag=$TAG \
              --namespace default \
              --wait --timeout 10m
          done

      - name: Install newman
        run: npm install -g newman

      - name: Run API Tests
        run: |
          newman run v3/postman/collection.json \
            -e v3/postman/environment.json \
            --env-var "password=${{ secrets.AUTH0_PASSWORD }}" \
            --env-var "clientSecret=${{ secrets.AUTH0_CLIENT_SECRET }}" \
            --delay-request 100 \
            --reporters cli

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOtoav-HWWtthJjnShIKnw3oIY"
          homework_number: 5
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"
